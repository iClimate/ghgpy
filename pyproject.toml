[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghgpy"
version = "0.1.0"
description = "A Python package for GHG (Greenhouse Gas) Inventory calculations based on IPCC Guidelines"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Bùi Khắc Tú", email = "bkt92@outlook.com"}
]
maintainers = [
    {name = "Bùi Khắc Tú", email = "bkt92@outlook.com"}
]
keywords = [
    "ghg",
    "greenhouse gas",
    "emissions",
    "inventory",
    "ipcc",
    "climate",
    "carbon",
    "environment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5.0",
    "openpyxl>=3.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
Homepage = "https://ghgpy.iclimate.io.vn"
Documentation = "https://ghgpy.iclimate.io.vn"
Repository = "https://github.com/bkt92/ghgpy"
Issues = "https://github.com/bkt92/ghgpy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ghgpy = ["data/*.xlsx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
