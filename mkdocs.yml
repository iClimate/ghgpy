site_name: GHGPy Docs
site_url: https://ghgpy.iclimate.io.vn/
site_description: GHG inventory, make it easy. A Python package for greenhouse gas calculations.
site_author: iClimate team

repo_url: https://github.com/iClimate/ghgpy/
repo_name: iClimate/ghgpy

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.integrate
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_bases: true
            heading_level: 3

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - About: about.md
  - Getting Started: getting_started.md
  - API Reference: reference.md
  - Patch History: patch_history.md
  - Developer Guide: devdocs.md
  - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iClimate/ghgpy
    - icon: fontawesome/solid/globe
      link: https://iclimate.io.vn